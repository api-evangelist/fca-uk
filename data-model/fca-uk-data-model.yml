- name: Firm
  api: FCA Financial Services Register API
  verified: false
  path: /services/V0.1/Firm/{FRN}
  key: Firm Reference Number (FRN)
  description: >-
    An authorised or previously authorised firm — including insurers, Lloyd's
    managing agents, MGAs, brokers and appointed representatives.
  sub_resources:
  - {path: '/Names', describes: trading and previous names}
  - {path: '/Individuals', describes: individuals attached to the firm}
  - {path: '/Permissions', describes: regulated activities the firm is permitted to carry on}
  - {path: '/Requirements', describes: requirements imposed on the permission}
  - {path: '/Requirements/{ref}/InvestmentTypes', describes: investment types under a requirement}
  - {path: '/Passports', describes: passported activity by country}
  - {path: '/Passports/{country}/Permission', describes: passported permissions in a country}
  - {path: '/Regulators', describes: current and previous regulators}
  - {path: '/AR', describes: appointed representatives of the firm}
  - {path: '/Address', describes: 'addresses; supports ?Type=PPOB and ?Type=Complaint'}
  - {path: '/Waivers', describes: waivers granted}
  - {path: '/Exclusions', describes: exclusions}
  - {path: '/DisciplinaryHistory', describes: disciplinary and enforcement history}
- name: Individual
  api: FCA Financial Services Register API
  verified: false
  path: /services/V0.1/Individuals/{IRN}
  key: Individual Reference Number (IRN)
  description: An approved or certified person on the Register.
  sub_resources:
  - {path: '/CF', describes: controlled functions held}
  - {path: '/DisciplinaryHistory', describes: disciplinary history}
- name: CollectiveInvestmentScheme
  api: FCA Financial Services Register API
  verified: false
  path: /services/V0.1/CIS/{PRN}
  key: Product Reference Number (PRN)
  description: A fund / collective investment scheme.
  sub_resources:
  - {path: '/Names', describes: scheme names}
  - {path: '/Subfund', describes: sub-funds of the scheme}
- name: SearchResult
  api: FCA Financial Services Register API
  verified: false
  path: /services/V0.1 common search
  description: >-
    Generic name search across firms, individuals and funds. Takes a name (or
    substring) and a resource type of firm | individual | fund, and returns rows
    carrying URL, Status, Reference Number, Type of business or Individual, Name.
relationships:
- from: Firm
  to: Individual
  kind: has_many
  via: /Firm/{FRN}/Individuals
- from: Firm
  to: Firm
  kind: has_many
  via: /Firm/{FRN}/AR
  note: >-
    principal → appointed representative. An AR may have more than one principal,
    so the graph is many-to-many; the API exposes it from the principal side.
- from: Individual
  to: Firm
  kind: belongs_to
  via: controlled functions held at a firm (/Individuals/{IRN}/CF)
- from: CollectiveInvestmentScheme
  to: CollectiveInvestmentScheme
  kind: has_many
  via: /CIS/{PRN}/Subfund
- from: SearchResult
  to: [Firm, Individual, CollectiveInvestmentScheme]
  kind: has_one
  via: the URL field, which is the absolute /services/V0.1 resource address
- from: FIRDSFile
  to: artefact
  kind: has_one
  via: download_link
- from: FITRSFile
  to: artefact
  kind: has_one
  via: download_link
id_prefixes:
- {entity: Firm, form: numeric FRN, examples: ['122702', '759676', '833790']}
- {entity: Individual, form: alphanumeric IRN, examples: [MXC29012, BXC00280, LAA01049]}
- {entity: CollectiveInvestmentScheme, form: numeric PRN, examples: ['635641', '185045']}
