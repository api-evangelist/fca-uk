generated: '2026-07-25'
method: searched
source: >-
  FCA FIRDS/FITRS technical specifications (FCA published) + live anonymous
  responses from https://api.data.fca.org.uk ; FS Register resource shape from
  community client documentation (the FCA reference is behind the portal login)
note: >-
  No OpenAPI exists to derive an entity graph from, so this model is assembled
  from two kinds of evidence and the provenance is marked per entity. The data
  publication entities are fully verified — the record shape below is copied from
  live responses and from the FCA's own technical specifications. The FS Register
  entities are marked `verified: false` because the FCA's reference documentation
  is behind the developer portal login and every anonymous probe under
  /services/V0.1 returns the same 403 regardless of whether the path is real.
entities:
- name: FIRDSFile
  api: FCA Data Publication API
  verified: true
  index: fca_data_firds_files
  underlying_index: fca-firds-downloadfiles
  description: >-
    One published UK instrument reference data file artefact (full, delta or
    invalid-instrument file) generated by FCA FIRDS.
  id_field: _id
  fields:
  - name: download_link
    type: uri
    example: https://data.fca.org.uk/artefacts/FIRDS/DLTINS_20210102_01of03.zip
    note: the artefact itself; downloads are explicitly exempt from throttling
  - name: file_type
    type: string
    enum: [FULINS, DLTINS, INVINS]
    searchable: true
  - name: file_name
    type: string
    pattern: <TYPE>_<YYYYMMDD>_<Key1>of<Key2>.zip
    searchable: true
  - name: publication_date
    type: date
    format: YYYY-MM-DD
    searchable: true
  - name: last_refreshed
    type: date-time
    format: ISO 8601
  volume:
    hits_total: 11583
    observed: '2026-07-25'
- name: FITRSFile
  api: FCA Data Publication API
  verified: true
  index: fca_data_fitrs_files
  underlying_index: fca-fitrs-downloadfiles
  description: >-
    One published UK transparency calculation result file artefact generated by
