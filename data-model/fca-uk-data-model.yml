  id_field: _id
  fields:
  - name: download_link
    type: uri
    example: https://data.fca.org.uk/artefacts/FITRS/FILES/DLTECR_20221212_1of1.zip
  - name: file_type
    type: string
    enum: [Full, Delta]
    searchable: true
  - name: file_name
    type: string
    searchable: true
  - name: instrument_type
    type: string
    example: Equity Instruments
    searchable: true
  - name: publication_date
    type: date
    format: YYYY-MM-DD
    searchable: true
  - name: last_refreshed
    type: date-time
    format: ISO 8601
  volume:
    hits_total: 2603
