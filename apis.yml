- aid: fca-uk:fca-data-publication-api
  name: FCA Data Publication API (FIRDS / FITRS)
  description: >-
    Anonymous machine-to-machine query interface over the file artefacts the FCA
    publishes through data.fca.org.uk, documented in the FCA's own FIRDS and FITRS
    technical specifications. It is an OpenSearch/Elasticsearch query-string search:
    the index name is the resource and the FCA supports a documented subset of the
    query_string DSL (q, from, size, sort, pretty, df, default_operator). Two indices
    respond publicly — fca_data_firds_files, holding UK instrument reference data file
    records under the UK MiFID regime that replaced ESMA FIRDS after Brexit, and
    fca_data_fitrs_files, holding UK transparency calculation result files. Each record
    carries download_link, file_type, file_name, publication_date, last_refreshed and,
    for FITRS, instrument_type. No credentials are required and no OpenAPI is published;
    every other index name probed returns 403 Missing Authentication Token. This is
    markets reference data, not insurance data.
  humanURL: https://data.fca.org.uk/#/download
  baseURL: https://api.data.fca.org.uk
