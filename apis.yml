url: https://raw.githubusercontent.com/api-evangelist/fca-uk/refs/heads/main/apis.yml
name: Financial Conduct Authority
kind: company
description: >-
  The Financial Conduct Authority (FCA) is the United Kingdom's conduct
  regulator for around 42,000 financial services firms and the prudential regulator
  for most non-bank firms, operating alongside the Prudential Regulation Authority
  under the dual-regulation model. In insurance the FCA owns conduct regulation of
  general insurance and protection markets through ICOBS and the Consumer Duty,
  authorises and supervises insurers, Lloyd's managing agents, MGAs, brokers and
  appointed representatives, and publishes market-wide insurance data such as the
  annual General Insurance Value Measures. Its API posture is that of a regulator,
  not a carrier: there is no open-insurance obligation in the UK and the FCA
  publishes no insurance product API of its own. It does operate two genuine public
  APIs. The Financial Services Register API at register.fca.org.uk/services/V0.1
  exposes firm, individual and fund authorisation records including insurance
  permissions and appointed-representative relationships; access is free and
  self-serve but the developer portal and its reference documentation sit behind a
  Salesforce registration login, and authentication is by X-Auth-Email and X-Auth-Key
  headers. The data publication API at api.data.fca.org.uk is an anonymous
  OpenSearch-style query interface over FIRDS and FITRS file artefacts, documented in
  the FCA's own published technical specifications — markets reference data, not
  insurance data. Neither API has an OpenAPI definition. Everything else the FCA publishes
  for the insurance market is documents and spreadsheets: the Handbook, market
  bulletins, consultation papers, and XLSX data releases. The FCA's Open Finance
  roadmap of 14 April 2026 names insurance as an in-scope sector but remains a vision
  document, with a formal discussion paper on the first scheme not due until Q4 2026,
  so no insurance data-sharing API mandate exists. No ACORD reference appears
  anywhere on fca.org.uk.
