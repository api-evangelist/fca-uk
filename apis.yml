apis:
- aid: fca-uk:fca-financial-services-register-api
  name: FCA Financial Services Register API
  description: >-
    Read-only REST API over the Financial Services Register, the FCA's
    public record of authorised firms, individuals, funds and appointed
    representatives. Resources are addressed by Firm Reference Number, Individual
    Reference Number or Product Reference Number and expose sub-resources for names,
    individuals, permissions, requirements, passports, regulators, appointed
    representatives, addresses, waivers, exclusions and disciplinary history — the
    permissions data being where insurance authorisations (insurance distribution,
    insurance mediation, Lloyd's market activity) surface. Registration is free and
    self-serve, but the developer portal and its reference documentation are behind a
    Salesforce login; authentication is by X-Auth-Email and X-Auth-Key request
    headers. No OpenAPI or Swagger definition is published by the FCA.
  humanURL: https://register.fca.org.uk/Developer/s/
  baseURL: https://register.fca.org.uk/services/V0.1
